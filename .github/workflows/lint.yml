name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Chinese README
        run: npx -y awesome-lint README.md

      - name: Lint English README
        run: npx -y awesome-lint readme.en.md
